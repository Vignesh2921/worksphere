<!DOCTYPE html>
<html>
<head><title>WorkSphere - Leave</title><link rel="stylesheet" href="dashboard.css"></head>
<body>
  <div class="sidebar">
    <h2>WorkSphere</h2><p id="userEmail"></p>
    <a href="dashboard.html">Dashboard</a>
    <a href="employees.html">Employees</a>
    <a href="attendance.html">Attendance</a>
    <a href="leave.html" class="active">Leave</a>
    <a href="salary.html">💰 Salary</a>
    <a href="#" onclick="logout()">Logout</a>
  </div>
  <div class="main">
    <div class="topbar"><h1>Leave</h1><p>Apply leave and Approve / Reject here.</p></div>
    <div class="table-box">
      <h3>Apply Leave</h3>
      <div class="form-row">
        <select id="leaveEmp"><option value="">Select Employee</option></select>
        <select id="leaveType"><option value="Sick">Sick Leave</option><option value="Casual">Casual Leave</option><option value="Vacation">Vacation</option></select>
        <input type="date" id="leaveFrom"><input type="date" id="leaveTo">
        <input type="text" id="leaveReason" placeholder="Reason">
        <button onclick="applyLeave()">Apply Leave</button>
      </div><p id="leaveMsg"></p>
      <h4>Leave Requests</h4>
      <table><thead><tr><th>Name</th><th>Type</th><th>From</th><th>To</th><th>Reason</th><th>Status</th><th>Action</th></tr></thead><tbody id="leaveTable"></tbody></table>
      <p id="noLeave">No leave requests yet.</p>
    </div>
  </div>
<script type="module" src="leave.js"></script>
</body>
</html>
