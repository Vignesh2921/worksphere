<!DOCTYPE html>
<html>
<head>
  <title>WorkSphere - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-box">
    <h1>WorkSphere</h1>
    <p>Employee Management System</p>
    <input id="email" type="email" placeholder="Company Email (e.g. name@worksphere.com)">
    <div class="pass-wrap">
      <input id="password" type="password" placeholder="Password">
      <span onclick="togglePass()" class="eye">👁️</span>
    </div>
    <p id="passHint">Password: 8+ chars, 1 Capital, 1 Number, 1 Special Char</p>
    <button onclick="login()">Login</button>
    <button onclick="signup()" class="outline">Sign Up</button>
    <div class="divider">OR</div>
    <button onclick="googleSignup()" class="google">Continue with Google</button>
    <p id="msg"></p>
  </div>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
