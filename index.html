<!DOCTYPE html>
<html>
<head><title>WorkSphere - Login</title><link rel="stylesheet" href="style.css"></head>
<body>
  <div class="login-box">
    <h1>WorkSphere</h1>
    <p>Employee Management System</p>
    <input id="email" type="email" placeholder="Company Email">
    <div class="pass-wrap">
      <input id="password" type="password" placeholder="Password">
      <span onclick="togglePass()" class="eye">👁️</span>
    </div>
    <button onclick="login()">Login</button>
    <p id="msg"></p>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
