<!DOCTYPE html>
<html>
<head>
  <title>WorkSphere - Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <!-- I made sidebar on left side -->
  <div class="sidebar">
    <h2>WorkSphere</h2>
    <p id="userEmail"></p>
    <a href="#" class="active">Dashboard</a>
    <a href="#">Employees</a>
    <a href="#">Attendance</a>
    <a href="#">Leave</a>
    <!-- I added logout here, it will take me back to login -->
    <a href="#" onclick="logout()">Logout</a>
  </div>

  <!-- I am showing all main content here -->
  <div class="main">
    <div class="topbar">
      <h1>Dashboard</h1>
      <p>Welcome back! Here is your overview.</p>
    </div>

    <!-- I added 4 small cards for overview -->
    <div class="cards">
      <div class="card"><h3>Total Employees</h3><p id="totalEmp">0</p></div>
      <div class="card"><h3>Present Today</h3><p>0</p></div>
      <div class="card"><h3>On Leave</h3><p>0</p></div>
      <div class="card"><h3>Departments</h3><p id="totalDept">0</p></div>
    </div>

    <!-- I added this form, HR will add employee from here -->
    <div class="table-box">
      <h3>Add Employee</h3>
      <div class="form-row">
        <input type="text" id="empName" placeholder="Employee Name - Ex: Vignesh">
        <input type="email" id="empEmail" placeholder="Email - Ex: vignesh@worksphere.com">
        <select id="empDept">
          <option value="IT">IT</option>
          <option value="HR">HR</option>
          <option value="Design">Design</option>
          <option value="Sales">Sales</option>
        </select>
        <button onclick="addEmployee()">Add Employee</button>
      </div>
      <p id="empMsg"></p>
    </div>

    <!-- I am showing employees list here, it will update when I add -->
    <div class="table-box">
      <h3>Employees List</h3>
      <table>
        <thead><tr><th>Name</th><th>Email</th><th>Department</th><th>Status</th></tr></thead>
        <tbody id="empTable"></tbody>
      </table>
      <p id="noEmp">No employees yet. Please add one.</p>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
